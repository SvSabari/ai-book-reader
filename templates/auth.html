<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Book Reader - Interactive Access</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ☕ Espresso Brown Dark Theme */
            --primary: #f59e0b; 
            --primary-glow: rgba(245, 158, 11, 0.3);
            --bg-img: url('/static/images/auth_dark_mocha.png');
            --card-bg: rgba(78, 52, 46, 0.95); 
            --text-main: #f5ebe0;
            --text-dim: #d6c0b3;
            --input-bg: rgba(93, 64, 55, 0.8);
            --border-radius-1x: 2px;
            --border-radius-2x: 4px;
            --spacing-half: 4px;
            --spacing-1x: 8px;
            --spacing-2x: 16px;
            --spacing-4x: 32px;
            --font-size-16: 16px;
            --login-form-el-height: 48px;
            --rive-bg: #4e342e;
        }

        [data-theme="light"] {
            /* 🕯️ Premium Nude Palette */
            --primary: #b58265; 
            --primary-glow: rgba(181, 130, 101, 0.25);
            --bg-img: url('/static/images/auth_light_nude.png');
            --card-bg: #ffffff; 
            --text-main: #3c3530;
            --text-dim: #8d8076;
            --input-bg: #fbf9f6;
            --rive-bg: #f4ece1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-img) center/cover no-repeat fixed;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text-main);
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 0;
        }

        .login-form-component-root {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-size: 10px;
            color: var(--text-main);
            height: auto;
            min-width: 500px;
            max-width: 95vw;
            max-height: 98vh; /* Almost full height */
            margin: 0 auto;
            z-index: 10;
            background: var(--card-bg);
            padding-top: 10px; /* Reduced padding */
            padding-bottom: 20px;
            border-radius: 40px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.6);
            overflow: hidden; /* REMOVED SCROLLBAR */
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }



        .rive-wrapper {
            width: 200px;
            height: 200px;
            background: var(--rive-bg);
            border-radius: 50%;
            margin: 5px auto 15px; /* Reduced top margin since flex-start has padding */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 4px solid rgba(255,255,255,0.1);
            transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            flex-shrink: 0;
        }

        .rive-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas {
            width: 260px; 
            height: 260px;
            margin-top: 5px;
            transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        /* Shrink bear slightly during registration to fit better */
        .is-registering .rive-wrapper {
            width: 130px;
            height: 130px;
            margin: 0 auto 10px;
        }
        .is-registering #canvas {
            width: 170px;
            height: 170px;
            margin-top: 0;
        }

        .login-form-wrapper, .register-form-wrapper {
            width: 100%;
            padding: 0 40px;
        }

        .form-container {
            background-color: transparent;
            padding: 20px 0;
            box-sizing: border-box;
            width: 100%;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem; /* Slightly smaller */
            margin-bottom: 20px; /* Reduced margin */
            text-align: center;
            color: var(--text-main);
        }

        .form-container label {
            display: block;
            margin-bottom: 6px; /* Reduced margin */
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .form-container input {
            height: var(--login-form-el-height);
            width: 100%;
            box-sizing: border-box;
            font-size: 1rem;
            color: var(--text-main);
            background-color: var(--input-bg);
            outline: none;
            padding: 0 20px;
            border: 2px solid transparent;
            border-radius: 16px;
            transition: all 0.3s;
        }

        .form-container input:focus {
            border-color: var(--primary);
            background: rgba(255,255,255,0.05);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .login-btn {
            display: block;
            border: none;
            height: var(--login-form-el-height);
            width: 100%;
            text-align: center;
            font-size: 1.1rem;
            border-radius: 16px;
            margin: 15px 0 10px; /* Reduced top margin */
            cursor: pointer;
            font-weight: 700;
            background-color: var(--primary);
            color: white;
            transition: all 0.3s;
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 15px 35px var(--primary-glow);
        }

        .switch-btn {
            font-size: 14px;
            color: var(--text-dim);
            text-decoration: none;
            display: block;
            text-align: center;
            margin-top: 15px;
        }

        .switch-btn b { color: var(--primary); cursor: pointer; text-decoration: underline; }

        .theme-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            border-radius: 18px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 200;
            font-size: 1.4rem;
        }

        .register-form-wrapper, .forgot-form-wrapper, .reset-form-wrapper { display: none; }
        .is-registering .login-form-wrapper, .is-forgot .login-form-wrapper, .is-reset .login-form-wrapper { display: none; }
        .is-registering .register-form-wrapper { display: block; }
        .is-forgot .forgot-form-wrapper { display: block; }
        .is-reset .reset-form-wrapper { display: block; }
    </style>
</head>

<body id="authBody" data-error="{{ error or '' }}" data-success="{{ success or '' }}" data-mode="{{ mode or '' }}">
    <button class="theme-btn" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span>
    </button>

    <div class="login-form-component-root" id="authCard">
        <div class="rive-wrapper">
            <div class="rive-container">
                <canvas id="canvas"></canvas>
            </div>
        </div>
        
        <!-- Login Form Wrapper -->
        <div class="login-form-wrapper" id="loginWrapper">
            <div class="form-container">
                <form action="/login" method="POST" autocomplete="off">
                    <h1>Welcome Back</h1>
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" name="username" id="login_username" placeholder="Username" required autocomplete="off" value="{{ submitted_username or '' }}">
                    </div>
                    <div style="height: 20px;"></div>
                    <div class="input-group">
                        <div style="display: flex; justify-content: space-between; align-items: baseline;">
                            <label style="margin-bottom: 6px;">Password</label>
                            <a href="#" onclick="toggleForms('forgot')" style="font-size: 12px; color: var(--primary); text-decoration: none; font-weight: 700; letter-spacing: 0.5px; transition: filter 0.2s;" onmouseover="this.style.filter='brightness(1.2)'" onmouseout="this.style.filter='none'">Forgot Password?</a>
                        </div>
                        <div style="position: relative;">
                            <input type="password" name="password" id="login_password" placeholder="••••••••" required autocomplete="off" style="padding-right: 40px; width: 100%;">
                            <span onclick="togglePasswordVisibility('login_password', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--primary); display: flex; align-items: center; justify-content: center; user-select: none;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </span>
                        </div>
                    </div>
                    <button type="submit" class="login-btn">Unlock Library</button>
                    <p class="switch-btn">New here? <b onclick="toggleForms('register')">Create Account</b></p>
                </form>
            </div>
        </div>

        <!-- Register Form Wrapper -->
        <div class="register-form-wrapper" id="registerWrapper">
            <div class="form-container">
                <form action="/register" method="POST">
                <h1>Join Us</h1>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <label>Full Name</label>
                        <input type="text" name="full_name" id="reg_fullname" placeholder="Full Name" required autocomplete="off">
                    </div>
                    <div>
                        <label>Email</label>
                        <input type="email" name="email" id="reg_email" placeholder="example@gmail.com" required autocomplete="off">
                    </div>
                </div>
                <div style="height: 10px;"></div>
                <label>Username</label>
                <input type="text" name="username" id="reg_username" placeholder="Username" required autocomplete="off">
                <div style="height: 10px;"></div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <label>Password</label>
                        <div style="position: relative;">
                            <input type="password" name="password" id="reg_password" placeholder="••••••••" required autocomplete="new-password" style="padding-right: 40px; width: 100%;">
                            <span onclick="togglePasswordVisibility('reg_password', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--primary); display: flex; align-items: center; justify-content: center; user-select: none;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </span>
                        </div>
                    </div>
                    <div>
                        <label>Confirm</label>
                        <div style="position: relative;">
                            <input type="password" name="confirm_password" id="reg_confirm" placeholder="••••••••" required autocomplete="new-password" style="padding-right: 40px; width: 100%;">
                            <span onclick="togglePasswordVisibility('reg_confirm', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--primary); display: flex; align-items: center; justify-content: center; user-select: none;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </span>
                        </div>
                    </div>
                </div>
                <button type="submit" class="login-btn">Create Account</button>
                <p class="switch-btn">Member? <b onclick="toggleForms('login')">Login Here</b></p>
                </form>
            </div>
        </div>

        <!-- Forgot Password Form Wrapper -->
        <div class="forgot-form-wrapper" id="forgotWrapper">
            <div class="form-container">
                <form action="/forgot_password" method="POST">
                    <h1>Reset Password</h1>
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" name="username" id="forgot_username" placeholder="Enter your username" required autocomplete="username">
                    </div>
                    <div style="height: 10px;"></div>
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" name="email" id="forgot_email" placeholder="example@gmail.com" required autocomplete="email">
                    </div>
                    <button type="submit" class="login-btn">Verify Account</button>
                    <p class="switch-btn">Remembered? <b onclick="toggleForms('login')">Login Here</b></p>
                </form>
            </div>
        </div>

        <!-- Reset Password Form Wrapper -->
        <div class="reset-form-wrapper" id="resetWrapper">
            <div class="form-container">
                <form action="/reset_password" method="POST">
                    <h1>New Password</h1>
                    <input type="hidden" name="username" value="{{ reset_username or '' }}">
                    <input type="hidden" name="email" value="{{ reset_email or '' }}">
                    <div class="input-group">
                        <label>New Password</label>
                        <div style="position: relative;">
                            <input type="password" name="password" id="reset_password" placeholder="••••••••" required autocomplete="new-password" style="padding-right: 40px; width: 100%;">
                            <span onclick="togglePasswordVisibility('reset_password', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--primary); display: flex; align-items: center; justify-content: center; user-select: none;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </span>
                        </div>
                    </div>
                    <div style="height: 10px;"></div>
                    <div class="input-group">
                        <label>Confirm Password</label>
                        <div style="position: relative;">
                            <input type="password" name="confirm_password" id="reset_confirm" placeholder="••••••••" required autocomplete="new-password" style="padding-right: 40px; width: 100%;">
                            <span onclick="togglePasswordVisibility('reset_confirm', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--primary); display: flex; align-items: center; justify-content: center; user-select: none;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </span>
                        </div>
                    </div>
                    <button type="submit" class="login-btn">Change Password</button>
                    <p class="switch-btn">Changed your mind? <b onclick="toggleForms('login')">Login Here</b></p>
                </form>
            </div>
        </div>
    </div>

    <!-- Rive Runtime -->
    <script src="https://unpkg.com/@rive-app/canvas@latest"></script>
    <script>
        const r = new rive.Rive({
            src: "https://public.rive.app/community/runtime-files/2244-4437-animated-login-screen.riv",
            canvas: document.getElementById("canvas"),
            autoplay: true,
            stateMachines: "Login Machine",
            onLoad: () => {
                r.resizeDrawingSurfaceToCanvas();
                const inputs = r.stateMachineInputs("Login Machine");
                const isChecking = inputs.find(i => i.name === "isChecking");
                const numLook = inputs.find(i => i.name === "numLook");
                const isHandsUp = inputs.find(i => i.name === "isHandsUp");

                const inputsToWatch = [
                    { id: "login_username", type: "user" },
                    { id: "login_password", type: "pass" },
                    { id: "reg_fullname", type: "user" },
                    { id: "reg_email", type: "user" },
                    { id: "reg_username", type: "user" },
                    { id: "reg_password", type: "pass" },
                    { id: "reg_confirm", type: "pass" },
                    { id: "forgot_username", type: "user" },
                    { id: "forgot_email", type: "user" },
                    { id: "reset_password", type: "pass" },
                    { id: "reset_confirm", type: "pass" }
                ];

                inputsToWatch.forEach(item => {
                    const el = document.getElementById(item.id);
                    if (el) {
                        el.addEventListener("focus", () => {
                            if (item.type === "pass") isHandsUp.value = true;
                            else isChecking.value = true;
                        });
                        el.addEventListener("blur", () => {
                            isHandsUp.value = false;
                            isChecking.value = false;
                        });
                        if (item.type === "user") {
                            el.addEventListener("input", (e) => {
                                if (numLook) numLook.value = e.target.value.length * 2;
                            });
                        }
                    }
                });
            }
        });

        function toggleForms(mode) {
            const root = document.querySelector('.login-form-component-root');
            root.classList.remove('is-registering', 'is-forgot', 'is-reset');
            if (mode === 'register') root.classList.add('is-registering');
            else if (mode === 'forgot') root.classList.add('is-forgot');
            else if (mode === 'reset') root.classList.add('is-reset');
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            const newTheme = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            icon.innerText = newTheme === 'light' ? '☀️' : '🌙';
            localStorage.setItem('reader-theme', newTheme);
        }

        const eyeSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        const eyeOffSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye-off"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-8-11-8a18.45 18.45 0 0 1 1.94-3.51M9.9 4.24A12.11 12.11 0 0 1 12 4c7 0 11 8 11 8a19.85 19.85 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

        function togglePasswordVisibility(inputId, toggleEl) {
            const input = document.getElementById(inputId);
            if (!input) return;
            if (input.type === "password") {
                input.type = "text";
                toggleEl.innerHTML = eyeOffSvg;
            } else {
                input.type = "password";
                toggleEl.innerHTML = eyeSvg;
            }
        }

        (function init() {
            const savedTheme = localStorage.getItem('reader-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const icon = document.getElementById('themeIcon');
            if (icon) icon.innerText = savedTheme === 'light' ? '☀️' : '🌙';

            const err = document.getElementById('authBody').dataset.error;
            const succ = document.getElementById('authBody').dataset.success;
            if (err && err !== '') {
                alert(err);
            }
            if (succ && succ !== '') {
                alert(succ);
            }

            const mode = document.getElementById('authBody').dataset.mode;
            if (mode === 'register' || mode === 'forgot' || mode === 'reset') {
                toggleForms(mode);
            }

            // Clean auto-fill values on normal page load / refresh
            setTimeout(() => {
                if (!err || err === '') {
                    const u = document.getElementById('login_username');
                    const p = document.getElementById('login_password');
                    if (u && !u.matches(':focus')) u.value = '';
                    if (p && !p.matches(':focus')) p.value = '';
                }
            }, 100);
        })();
    </script>
</body>

</html>
